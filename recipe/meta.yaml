{% set name = "fugue-sql-antlr" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fugue-sql-antlr-{{ version }}.tar.gz
  sha256: 22af96a6aa295441425482c6619daac1702de222c942ede12b36bc2e2993aa40

build:
  # s390x is missing triad
  skip: true  # [py<38 or s390x]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - antlr4-python3-runtime <4.12
    - jinja2
    - python
    - triad >=0.6.8
    - packaging
  run_constrained:
    - fugue-sql-antlr-cpp ==0.2.2

test:
  imports:
    - fugue_sql_antlr
    - fugue_sql_antlr_version
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fugue-project/fugue-sql-antlr
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Fugue SQL Antlr Parser
  description: Fugue SQL Antlr Parser
  dev_url: https://github.com/fugue-project/fugue-sql-antlr
  doc_url: https://github.com/fugue-project/fugue-sql-antlr/blob/master/README.md

extra:
  recipe-maintainers:
    - charlesbluca
    - kvnkho
    - goodwanghan
    - thewchan
